name: Update market conditions scorecard

on:
  schedule:
    # 09:30 Singapore time, after the Singapore close and the prior US session.
    - cron: "30 1 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-scorecard-update
  cancel-in-progress: false

jobs:
  update-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data libraries
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.66" "pandas==2.2.3"
      - name: Calculate market conditions
        run: python scripts/update_market_scorecard.py
      - name: Publish scorecard JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-scorecard.json
          if git diff --cached --quiet; then
            echo "No scorecard changes to publish."
          else
            git commit -m "Update daily market conditions scorecard"
            git push
          fi
