name: Update market conditions scorecard

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_market_scorecard.py"
      - "data/sti-constituents.json"
      - ".github/workflows/market-scorecard.yml"
  schedule:
    # 06:00 Singapore time: 1–2 hours after the prior US close (depending on US daylight saving time).
    - cron: "0 22 * * 0-5"
    # 18:30 Singapore time: first update after the Singapore close.
    - cron: "30 10 * * 1-6"
    # First fallback: retry 5 minutes later if the main run is delayed or missed.
    - cron: "35 10 * * 1-6"
    # Further retries in case Yahoo Finance or the scheduled runner is delayed.
    - cron: "45 10 * * 1-6"
    - cron: "0,15,30,45 11 * * 1-6"
    - cron: "0,15 12 * * 1-6"
  workflow_dispatch:

# Manual one-off trigger for Singapore Yahoo freshness test; the workflow also runs on push.

permissions:
  contents: write

concurrency:
  group: market-scorecard-update
  cancel-in-progress: false

jobs:
  update-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data libraries
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance==0.2.66" "pandas==2.2.3" "exchange_calendars==4.13.2"
      - name: Calculate market conditions
        run: python scripts/update_market_scorecard.py
      - name: Publish scorecard JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-scorecard.json
          if git diff --cached --quiet; then
            echo "No scorecard changes to publish."
          else
            git commit -m "Update daily market conditions scorecard"
            git push
          fi
