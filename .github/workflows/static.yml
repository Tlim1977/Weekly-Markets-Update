# Deploy the static site to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows this workflow to be run manually from the Actions tab
  workflow_dispatch:

  # The scorecard workflow commits JSON using GITHUB_TOKEN, which does not
  # trigger a push workflow. Deploy Pages after that workflow completes.
  workflow_run:
    workflows: ["Update market conditions scorecard"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Do not publish if the scorecard workflow itself failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize banner image for Pages
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('assets/weekly-markets-banner.png').convert('RGB')
          image.save('assets/weekly-markets-banner.webp', 'WEBP', quality=82, method=6)
          PY
          rm assets/weekly-markets-banner.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
